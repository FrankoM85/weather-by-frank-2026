<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 128" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">WEATHER by Frank</title>
  <desc id="logo-desc">Sun behind blue clouds, followed by WEATHER by Frank</desc>
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f5fbff"/><stop offset="1" stop-color="#35b9ff"/></linearGradient>
    <linearGradient id="cloud-back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4ee6ee"/><stop offset="1" stop-color="#1c96e5"/></linearGradient>
    <linearGradient id="cloud-front" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#56d5ff"/><stop offset="1" stop-color="#2864d9"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffdb40"/><stop offset="1" stop-color="#ff9e17"/></linearGradient>
  </defs>
  <!-- Change theme colors in the gradients above; the background is transparent. -->
  <g stroke="url(#sun)" stroke-width="5" stroke-linecap="round">
    <path d="M78 7v10 M42 21l-7-7 M113 21l7-7 M124 53h10"/>
  </g>
  <circle cx="79" cy="55" r="35" fill="url(#sun)"/>
  <path d="M20 107c-12 0-18-9-18-19 0-12 9-21 20-21 2-20 19-34 39-34 19 0 35 12 39 29 16 0 29 13 29 28 0 10-7 17-18 17Z" fill="url(#cloud-back)"/>
  <path d="M27 113c-12 0-20-9-20-20s9-20 20-20c4-13 15-21 29-21 13 0 24 8 28 20 3-1 6-2 10-2 15 0 27 12 27 27 0 9-7 16-17 16Z" fill="url(#cloud-front)" opacity=".92"/>
  <path d="M24 112c-10 0-17-7-17-16 0-9 7-16 16-16 4-10 13-16 24-16 12 0 22 7 25 17 2-1 5-1 7-1 12 0 21 9 21 20 0 7-5 12-13 12Z" fill="#2254c9" opacity=".8"/>
  <text x="143" y="87" fill="url(#word)" font-family="Inter, Arial, sans-serif" font-weight="850" font-size="66" letter-spacing="-3.2">WEATHER</text>
  <text x="518" y="86" fill="#98aabd" font-family="Inter, Arial, sans-serif" font-size="39" font-weight="400">by</text>
  <text x="573" y="86" fill="#2ed9f1" font-family="Inter, Arial, sans-serif" font-size="41" font-weight="600">Frank</text>
